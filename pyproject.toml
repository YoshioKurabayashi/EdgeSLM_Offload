[project]
name = "edge-slm-offload"
version = "0.1.0"
description = "モデルの一部の層をGPUにオフロードした場合の推論挙動を検証するプロジェクト"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "numpy>=1.26.0",
    # torchはcu128系（RTX 5070 Ti / sm_120対応）。下部の[[tool.uv.index]]を参照
    "torch>=2.7.0",
    "transformers>=5.14.1",
    # 層単位のデバイス配置（device_map）に必須。本プロジェクトの中核依存
    "accelerate>=1.14.0",
    "psutil>=6.0.0",
    "matplotlib>=3.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 既定の %TEMP%\pytest-of-<user> がアクセス拒否になる環境のため、
# tmp_path の置き場をプロジェクト内に移す
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

# グローバルPythonのtorch 2.4.0+cu121はsm_120に非対応のため、
# プロジェクト固有の.venvにcu128系を入れる（要件定義書3.2節）
[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"
